<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040915" />
      <stop offset="45%" stop-color="#060e22" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <!-- Glowing Electric Blue Border -->
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <!-- Silver Pickaxe Gradients -->
    <linearGradient id="pickHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="pickHandleHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pickHandleShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Dark Facets -->
    <linearGradient id="mountainDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23344d" />
      <stop offset="100%" stop-color="#0d1524" />
    </linearGradient>

    <linearGradient id="mountainLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#718096" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain Gold Top & Ridge Gradients -->
    <linearGradient id="goldTopFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="goldRidgeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Gold Bar Chart Gradient -->
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with exact rounded proportions matching uploaded logo -->
  <rect x="25" y="25" width="462" height="462" rx="112" ry="112" fill="url(#bgGrad)" />
  <!-- Glowing Electric Blue Outer Neon Border -->
  <rect x="25" y="25" width="462" height="462" rx="112" ry="112" fill="none" stroke="url(#blueBorder)" stroke-width="12" />

  <!-- GRAPHIC ICON GROUP -->
  <g id="mineIntelGraphic">
    <!-- 1. Dark Mountain Base (Back layer) -->
    <polygon points="126,298 266,172 334,298" fill="url(#mountainDark)" />
    <!-- Lower shadow fold -->
    <polygon points="172,298 266,236 334,298" fill="#09101b" />
    <!-- Silver-Blue Light Reflection facet on left slope -->
    <polygon points="158,284 266,172 216,284" fill="url(#mountainLightFacet)" opacity="0.85" />

    <!-- 2. Golden Mountain Ridge & 3D Origami Facets -->
    <!-- Upper Golden Peak Facet (lit face) -->
    <polygon points="266,172 250,236 308,206" fill="url(#goldTopFacet)" />
    <polygon points="250,236 266,172 284,216" fill="#fef08a" />
    <!-- Main Descending Golden Slope / Ridge that heads toward the chart -->
    <polygon points="266,172 308,206 396,298 376,298 322,238" fill="url(#goldRidgeFacet)" />
    <!-- Lower orange-amber fold accent -->
    <polygon points="308,206 322,238 396,298 382,298" fill="#b45309" />

    <!-- 3. Rising Bar Chart on the right (3 ascending bars) -->
    <!-- Bar 1 (Short) -->
    <rect x="330" y="226" width="18" height="72" rx="2" fill="url(#goldBarGrad)" />
    <!-- Bar 2 (Medium) -->
    <rect x="354" y="208" width="18" height="90" rx="2" fill="url(#goldBarGrad)" />
    <!-- Bar 3 (Tall) -->
    <rect x="378" y="186" width="18" height="112" rx="2" fill="url(#goldBarGrad)" />

    <!-- 4. The Silver Metallic Pickaxe (Dominant Front Diagonal) -->
    <!-- Pickaxe Handle - Base Shadow Side -->
    <polygon points="274,142 292,154 126,300 114,300" fill="url(#pickHandleShadow)" />
    <!-- Pickaxe Handle - Top Highlight Bevel -->
    <polygon points="274,142 282,148 118,300 114,300" fill="url(#pickHandleHighlight)" />
    <!-- Handle bottom sharp cut -->
    <polygon points="114,300 126,300 118,290" fill="#cbd5e1" />

    <!-- Pickaxe Curved Head (Top Crescent Arch) -->
    <path d="M 174,86 C 220,78 282,106 344,204 C 322,194 286,146 244,124 C 214,108 192,100 174,86 Z" fill="url(#pickHeadGrad)" />
    <!-- Pickaxe Razor Edge Highlight -->
    <path d="M 174,86 C 212,94 260,118 312,176 L 302,184 C 258,136 216,114 174,86 Z" fill="#ffffff" />
    <!-- Pickaxe Back Point & Center joint cap -->
    <path d="M 238,122 L 274,142 L 292,154 L 282,126 Z" fill="#e2e8f0" opacity="0.95" />
  </g>

  <!-- 5. "MineIntel" Brand Typography matching uploaded logo -->
  <g id="mineIntelBrandText">
    <!-- "Mine" in crisp pure white -->
    <text x="74" y="390" font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="70" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Mine</text>
    <!-- "Intel" in warm gold-orange gradient -->
    <text x="264" y="390" font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="70" font-weight="900" fill="url(#textGoldGrad)" letter-spacing="-1.5">Intel</text>
  </g>
</svg>
