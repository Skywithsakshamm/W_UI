    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var defineAccessor = function(obj) {
            try {
              var desc = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (!desc || !desc.set) {
                Object.defineProperty(obj, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          };

          defineAccessor(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineAccessor(Window.prototype);
          }
        } catch (err) {
          // Safeguard in case environment prevents redefinition
        }
      })();
    </script>
